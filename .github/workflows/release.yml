name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tmux and git for the tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux git
          git config --global user.name ci
          git config --global user.email ci@localhost

      - name: Vet and test
        run: make check

      - name: Build release binaries
        run: make dist VERSION=${{ github.ref_name }}

      - name: Smoke-test the linux binary
        run: |
          got="$(./dist/agentboard-linux-x86_64 --version)"
          echo "$got"
          [ "$got" = "agentboard ${{ github.ref_name }}" ]

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
